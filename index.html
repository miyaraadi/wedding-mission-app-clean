<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>משימת החתונה</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>

  <main class="card">

    <section id="missionView">

      <div class="eyebrow">WEDDING MISSION</div>

      <h1 id="missionNumber"></h1>

      <p id="missionText">
        טוען את המשימה…
      </p>

      <div class="upload-buttons">

        <label class="upload-btn">
          📸 צלמו עכשיו
          <input
            id="captureInput"
            type="file"
            accept="image/*,video/*"
            capture="environment"
            hidden
          />
        </label>

        <label class="upload-btn secondary">
          📁 בחרו מהטלפון
          <input
            id="chooseInput"
            type="file"
            accept="image/*,video/*"
            hidden
          />
        </label>

      </div>

      <p id="statusText"></p>

      <div class="date">
        11.3.27
      </div>

    </section>


    <section id="successView" class="hidden">

      <div class="eyebrow">MISSION COMPLETE</div>

      <h1>המשימה הושלמה ❤️</h1>

      <p>
        תודה שהשארתם לנו זיכרון מהחתונה
      </p>

      <div class="date">
        11.3.27
      </div>

    </section>

  </main>

  <script src="/app.js"></script>

</body>
</html>
