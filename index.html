<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wedding Mission — Adi & Nitay</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>

  <div class="page">

    <header class="hero">
      <div class="small-title">WEDDING MISSION</div>

      <h1>ADI <span>&</span> NITAY</h1>

      <div class="date">
        11.03.2027
      </div>
    </header>

    <main>

      <section id="missionView" class="mission-card">

        <div class="mission-label">
          משימה
        </div>

        <div id="missionNumber" class="mission-number"></div>

        <p id="missionText" class="mission-text">
          טוען את המשימה…
        </p>

        <div class="name-area">
          <label for="guestName">מי אתם?</label>

          <input
            id="guestName"
            type="text"
            placeholder="כתבו את השם שלכם"
          />

          <div id="nameError" class="error"></div>
        </div>

        <div class="upload-title">
          העלו את התמונה / הסרטון שלכם
        </div>

        <div class="upload-buttons">

          <label class="upload-btn burgundy">
            <div class="button-icon">📷</div>
            <strong>צלמו עכשיו</strong>
            <small>השתמשו במצלמה</small>

            <input
              id="captureInput"
              type="file"
              accept="image/*,video/*"
              capture="environment"
              hidden
            />
          </label>

          <label class="upload-btn gold">
            <div class="button-icon">▧</div>
            <strong>בחרו מהגלריה</strong>
            <small>תמונה או סרטון</small>

            <input
              id="chooseInput"
              type="file"
              accept="image/*,video/*"
              hidden
            />
          </label>

        </div>

        <p id="statusText"></p>

        <div class="whatsapp">

          <div class="whatsapp-title">
            לא עובד לכם? שלחו לנו בוואטסאפ ♥
          </div>

          <div class="whatsapp-buttons">

            <a
              id="whatsappAdi"
              href="#"
              target="_blank"
            >
              שלחו לעדי
              <span>054-3330598</span>
            </a>

            <a
              id="whatsappNitay"
              href="#"
              target="_blank"
            >
              שלחו לנתאי
              <span>052-3357812</span>
            </a>

          </div>

        </div>

      </section>

      <section id="successView" class="mission-card hidden">

        <div class="small-title">
          MISSION COMPLETE
        </div>

        <h2>
          המשימה הושלמה ♥
        </h2>

        <p>
          תודה שהשארתם לנו זיכרון מהחתונה
        </p>

        <div class="success-names">
          Adi & Nitay
        </div>

      </section>

    </main>

    <footer>
      תודה שאתם חלק מהיום המיוחד שלנו ♥
    </footer>

  </div>

  <script src="/app.js"></script>

</body>
</html>
