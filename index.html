<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b1720" />

  <title>Wedding Mission — Adi & Nitay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Heebo:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/style.css" />
</head>

<body>

  <div class="page">

    <header class="hero">
      <div class="small-title">WEDDING MISSION</div>

      <h1>
        ADI <span>&</span> NITAY
      </h1>

      <div class="date">
        11.03.2027
      </div>
    </header>

    <main>

      <section id="missionView" class="mission-card">

        <div class="mission-head">
          <div class="mission-label">משימה</div>
          <div id="missionNumber" class="mission-number"></div>
        </div>

        <p id="missionText" class="mission-text">
          טוען את המשימה…
        </p>

        <div class="name-area">

          <label for="guestName">
            השם שלכם
            <span>לא חובה</span>
          </label>

          <input
            id="guestName"
            type="text"
            placeholder="אפשר להשאיר שם"
            maxlength="80"
          />

        </div>

        <div class="choose-area">

          <div class="upload-title">
            בחרו תמונה או סרטון
          </div>

          <div class="upload-buttons">

            <label class="upload-btn burgundy">

              <span class="line-icon camera-icon" aria-hidden="true"></span>

              <strong>צלמו עכשיו</strong>

              <input
                id="captureInput"
                type="file"
                accept="image/*,video/*"
                capture="environment"
                multiple
                hidden
              />

            </label>

            <label class="upload-btn gold">

              <span class="line-icon image-icon" aria-hidden="true"></span>

              <strong>בחרו מהגלריה</strong>

              <input
                id="chooseInput"
                type="file"
                accept="image/*,video/*"
                multiple
                hidden
              />

            </label>

          </div>

        </div>

        <div id="selectedFileBox" class="selected-file hidden">

          <div class="selected-check">✓</div>

          <div>
            <strong>הקובץ מוכן להעלאה</strong>
            <span id="selectedFileName"></span>
          </div>

        </div>

        <button
          id="uploadButton"
          class="final-upload hidden"
          type="button"
        >
          העלו עכשיו
        </button>

        <div id="loadingBox" class="loading-box hidden">

          <div class="loader"></div>

          <strong>מעלים את הזיכרון שלכם…</strong>

          <span>
            אל תסגרו את החלון
          </span>

        </div>

        <p id="statusText" class="status-text"></p>

        <div class="whatsapp">

          <div class="whatsapp-title">
            לא עובד לכם? שלחו לנו בוואטסאפ
          </div>

          <div class="whatsapp-buttons">

            <a
              id="whatsappAdi"
              href="#"
              target="_blank"
              rel="noopener"
            >
              <strong>עדי</strong>
              <span>054-3330598</span>
            </a>

            <a
              id="whatsappNitay"
              href="#"
              target="_blank"
              rel="noopener"
            >
              <strong>נתאי</strong>
              <span>052-3357812</span>
            </a>

          </div>

        </div>

      </section>

      <section id="successView" class="mission-card success-card hidden">

        <div class="success-mark">✓</div>

        <h2>
          המשימה הושלמה
        </h2>

        <p>
          תודה שהשארתם לנו זיכרון מהחתונה
        </p>

        <div class="success-names">
          Adi & Nitay
        </div>

      </section>

    </main>

  </div>

  <script src="/app.js"></script>

</body>
</html>
